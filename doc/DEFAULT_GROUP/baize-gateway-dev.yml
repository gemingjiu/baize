spring:
  data:
    redis:
      host: ${baize.redis.host}
      port: ${baize.redis.port}
      password: ${baize.redis.password}
  cloud:
    sentinel:
      transport:
        dashboard: localhost:8858
        port: 8719
      eager: true
    loadbalancer:
      enabled: true
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      default-filters:
        - AddRequestHeader=Gateway-Request, From-Gateway      
      routes:
        # 认证中心
        - id: baize-auth
          uri: lb://baize-auth
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=2
          metaData:
            skipAuth: true

        # 系统模块
        - id: baize-admin
          uri: lb://baize-admin
          predicates:
            - Path=/api/v1/admin/**
          filters:
            - StripPrefix=2
logging:
  level:
    org.springframework: debug
    com.gem: debug
# 安全配置
baize:
  gateway:
    # 验证码
    captcha:
      enabled: true
      type: math
    # 防止XSS攻击
    xss:
      enabled: true
      excludeUrls:
        - /system/notice