spring:
  data:
    redis:
      host: ${baize.redis.host}
      port: ${baize.redis.port}
      password: ${baize.redis.password}
  cloud:
    sentinel:
      transport:
        dashboard: localhost:8858
        port: 8719
      eager: true
    loadbalancer:
      enabled: true
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      default-filters:
        - AddRequestHeader=Gateway-Request, From-Gateway
      routes:
        # 认证服务API文档路由（更精确的路径放前面）
        - id: baize-auth-docs
          uri: lb://baize-auth
          predicates:
            - Path=/api/v1/auth/v3/api-docs/**
          filters:
            - StripPrefix=2
          metadata:
            skipAuth: true

        # 认证中心
        - id: baize-auth
          uri: lb://baize-auth
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=2
          metadata:
            skipAuth: true

        # 系统服务API文档路由（更精确的路径放前面）
        - id: baize-system-docs
          uri: lb://baize-system
          predicates:
            - Path=/api/v1/system/v3/api-docs/**
          filters:
            - StripPrefix=2
          metadata:
            skipAuth: true

        # 系统模块（需要认证）
        - id: baize-system
          uri: lb://baize-system
          predicates:
            - Path=/api/v1/system/**
          filters:
            - StripPrefix=2

# Swagger UI 聚合配置
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: true
    disable-swagger-default-url: true
    urls:
      - name: baize-auth
        url: /api/v1/auth/v3/api-docs
      - name: baize-system
        url: /api/v1/system/v3/api-docs

logging:
  level:
    org.springframework: debug
    com.gem: debug
# 安全配置
baize:
  gateway:
    # 验证码
    captcha:
      enabled: true
      type: math
    # 防止XSS攻击
    xss:
      enabled: true
      excludeUrls:
        - /system/notice
    # 白名单路径
    whitelist:
      - /api/v1/auth/**
      - /api/v1/system/v3/api-docs/**
      - /swagger-ui.html
      - /swagger-ui/**
      - /webjars/**
      - /v3/api-docs/**
