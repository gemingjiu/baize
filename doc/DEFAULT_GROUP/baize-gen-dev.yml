# spring配置
spring:
  redis:
    host: ${baize.redis.host}
    port: ${baize.redis.port}
    password: ${baize.redis.password}

  datasource:
    #设置默认的数据源或者数据源组,默认值即为master
    primary: master
    #严格匹配数据源,默认false. true未匹配到指定数据源时抛异常,false使用默认数据源
    strict: true
    druid:
      stat-view-servlet:
        enabled: true
        loginUsername: admin
        loginPassword: 123456
    dynamic:
      druid:
        initial-size: 5
        min-idle: 5
        maxActive: 20
        maxWait: 60000
        timeBetweenEvictionRunsMillis: 60000
        minEvictableIdleTimeMillis: 300000
        validationQuery: SELECT 1
        testWhileIdle: true
        testOnBorrow: false
        testOnReturn: false
        poolPreparedStatements: true
        maxPoolPreparedStatementPerConnectionSize: 20
        filters: stat,slf4j
        connectionProperties: druid.stat.mergeSql\\=true;druid.stat.slowSqlMillis\\=5000
      datasource:
        master:
          driver-class-name: org.postgresql.Driver
          url: jdbc:postgresql://${baize.datasource.master.addr}/${baize.datasource.master.schema}?currentSchema=baize-gen&stringtype=unspecified
          username: ${baize.datasource.master.username}
          password:  ${baize.datasource.master.password}
logging:
  level:
      com.baize = debug   
# mybatis配置
mybatis:
    # 搜索指定包别名
    typeAliasesPackage: com.baize.gen.entity
    # 配置mapper的扫描，找到所有的mapper.xml映射文件
    mapperLocations: classpath:mapper/**/*.xml

# swagger配置
swagger:
  title: 代码生成接口文档
  license: Powered By baize
  licenseUrl: https://baize.vip

# 代码生成
gen:
  # 作者
  author: baize
  # 默认生成包路径 system 需改成自己的模块名称 如 system monitor tool
  packageName: com.baize.system
  # 自动去除表前缀，默认是false
  autoRemovePre: false
  # 表前缀（生成类名不会包含表前缀，多个用逗号分隔）
  tablePrefix: sys_