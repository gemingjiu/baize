# spring配置
spring:
  cache:
    type: redis
  data:
    redis:
      host: ${baize.redis.host}
      port: ${baize.redis.port}
      password: ${baize.redis.password:}
  datasource:
    dynamic:
      primary: master
      strict: true
      druid:
        stat-view-servlet:
          enabled: true
          loginUsername: ${baize.datasource.addr}
          loginPassword: ${baize.datasource.password}
        initial-size: 5
        min-idle: 5
        maxActive: 20
        maxWait: 60000
        timeBetweenEvictionRunsMillis: 60000
        minEvictableIdleTimeMillis: 300000
        validationQuery: SELECT 1
        testWhileIdle: true
        testOnBorrow: false
        testOnReturn: false
        poolPreparedStatements: true
        maxPoolPreparedStatementPerConnectionSize: 20
        filters: stat,slf4j
        connectionProperties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
      datasource:
        master:
          driver-class-name: org.postgresql.Driver
          url: jdbc:postgresql://${baize.datasource.master.addr}/${baize.datasource.master.schema}?currentSchema=baize-system&stringtype=unspecified
          username: ${baize.datasource.master.username}
          password: ${baize.datasource.master.password}

# 日志相关配置
logging:
  level:
    com.baomidou.mybatisplus.core.MybatisConfiguration: debug
    com.baomidou.mybatisplus.core.executor.MybatisSimpleExecutor: debug
    com.baomidou.mybatisplus.extension.plugins.MybatisPlusInterceptor: debug
    com.baomidou.mybatisplus: debug
    com.gem: debug

# mybatis-plus配置
mybatis-plus:
  # 搜索指定包别名
  type-aliases-package: com.gem.baize.common.core.entity;com.gem.baize.system.*.entity
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# swagger配置
swagger:
  title: 代码生成接口文档
  license: Powered By baize
  licenseUrl: https://baize.com
