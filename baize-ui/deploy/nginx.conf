# ============================================================================
# baize-ui 生产环境 nginx 配置（镜像：nginx:1.27-alpine）
#
# 网关地址说明：
#   nginx 不能直接读取容器环境变量，这里直接写 compose / k8s 中的服务名 gateway:8000。
#   如确需环境变量注入，可将本文件放到 /etc/nginx/templates/default.conf.template
#   （官方镜像的 20-envsubst-on-templates.sh 会在启动时替换 ${GATEWAY_HOST} 等占位符）。
#   本文件位于 conf.d 下，被 include 进 http 块，因此可以使用 map / upstream。
# ============================================================================
map $http_accept $baize_accept_html {
    default 0;
    "~*text/html" 1;
}

upstream baize_gateway {
    server gateway:8000;
    keepalive 32;
}

server {
    # 容器以非 root 用户（nginx）运行，无法绑定 1024 以下端口，因此监听 8080；
    # 对外暴露的端口在 Dockerfile EXPOSE 8080 / compose ports 中映射。
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    client_max_body_size 20m;

    # ---- 前端静态资源 ----
    # history 路由：找不到文件时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # ---- 后端接口 ----
    # 已带 /api/v1 前缀的请求（如 Swagger / OpenAPI 文档）直接透传给网关
    location /api/ {
        proxy_pass http://baize_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # 前端请求 /auth/**：补 /api/v1 前缀（与 baize-ui/config/proxy.ts 的开发代理行为一致）
    location /auth/ {
        proxy_pass http://baize_gateway/api/v1/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # 前端页面路由（/system/login、/system/user 等）与后端接口前缀 /system/ 重叠：
    #   - 浏览器导航请求的 Accept 含 text/html → 返回 SPA 入口由前端路由接管；
    #   - axios 发起的接口请求 → 代理到网关并补 /api/v1 前缀。
    # 长期建议：前端接口统一加 /api 前缀，届时可删除这里的 Accept 判据。
    location /system/ {
        if ($baize_accept_html = 1) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://baize_gateway/api/v1/system/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # 容器健康检查
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
