# spring配置
spring:
  cache:
    type: redis
  data:
    redis:
      host: ${baize.redis.host}
      port: ${baize.redis.port}
      password: ${baize.redis.password:}
  datasource:
    # Druid 监控页开关归属 druid-spring-boot-3-starter 的 spring.datasource.druid.stat-view-servlet.enabled
    # （见 DruidStatViewServletConfiguration 的 @ConditionalOnProperty）。
    # dynamic-datasource 的 spring.datasource.dynamic.druid 下没有 statViewServlet 这一项，
    # 原配置把监控页写在 dynamic 下，只会被当成未知属性丢弃，等于既没开页面、又把数据库口令明文留在配置里。
    # 与 baize-gen-dev.yml 一致：直接关闭监控页，配置中不保留任何监控台登录凭据。
    druid:
      stat-view-servlet:
        enabled: false
    dynamic:
      primary: master
      strict: true
      druid:
        initial-size: 5
        min-idle: 5
        maxActive: 20
        maxWait: 60000
        timeBetweenEvictionRunsMillis: 60000
        minEvictableIdleTimeMillis: 300000
        validationQuery: SELECT 1
        testWhileIdle: true
        testOnBorrow: false
        testOnReturn: false
        poolPreparedStatements: true
        maxPoolPreparedStatementPerConnectionSize: 20
        filters: stat,slf4j
        connectionProperties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
      datasource:
        master:
          driver-class-name: org.postgresql.Driver
          # baize.datasource.master.schema 是数据库名（baize），currentSchema 是库内 schema（baize-system），两者不是一回事
          url: jdbc:postgresql://${baize.datasource.master.addr}/${baize.datasource.master.schema}?currentSchema=baize-system&stringtype=unspecified
          username: ${baize.datasource.master.username}
          password: ${baize.datasource.master.password}

# 日志相关配置
logging:
  level:
    com.baomidou.mybatisplus.core.MybatisConfiguration: debug
    com.baomidou.mybatisplus.core.executor.MybatisSimpleExecutor: debug
    com.baomidou.mybatisplus.extension.plugins.MybatisPlusInterceptor: debug
    com.baomidou.mybatisplus: debug
    com.gem: debug

# mybatis-plus配置
mybatis-plus:
  # 搜索指定包别名
  type-aliases-package: com.gem.baize.common.core.entity;com.gem.baize.system.*.entity
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# swagger配置
swagger:
  title: 代码生成接口文档
  license: Powered By baize
  licenseUrl: https://baize.com

# ============================================================================
# 服务自身 context-path：把 /api/v1 前缀从网关 StripPrefix 下沉到本服务
# 网关路由改为 Path=/api/v1/system/** -> lb://baize-system（不再 StripPrefix）
# 访问形如 http://localhost:8020/api/v1/system/user/current
# 注意：此改动必须与 8 个 Feign 客户端的 @FeignClient(path="/api/v1/system") 同步，
#       否则 baize-auth 经 Feign 调 baize-system 会 404。
# ============================================================================
# 网关↔后端身份头签名密钥（P0-A）：与 baize-gateway-dev.yml 的 baize.gateway.signature-secret 一致
# 后端校验身份头 HMAC 时才信任 X-Tenant-Id/X-User-Id 等；缺失该密钥则降级放行（开发态）
baize:
  gateway:
    signature-secret: 950f7d50269358900739304867aa724ba00efc5d65735e06cd26d4178b67f3a

server:
  servlet:
    context-path: /api/v1
