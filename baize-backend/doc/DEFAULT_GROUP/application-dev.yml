spring:
  # T2.4 韧性：优雅停机。收到 SIGTERM 后先停止接收新请求，等待在途请求完成
  # （与 K8s preStop sleep 5s + terminationGracePeriodSeconds 45s 配合），
  # 避免滚动更新/节点排水时正在处理的请求被硬切断。
  lifecycle:
    timeout-per-shutdown-phase: 30s
  data:
    redis:
      host: ${baize.redis.host}
      port: ${baize.redis.port}
      password: ${baize.redis.password}
  cloud:
    sentinel:
      # T2.4：Sentinel 必须保持 enabled=true，否则 SentinelAutoConfiguration 不装配，
      # SentinelDataSourceHandler 也就不会注册 —— 规则永远为空（这一点极易误判为"规则没生效"）。
      enabled: true
      transport:
        # 开发集群未部署 Sentinel 控制台，地址留空：SCA 约定"地址为空时不尝试连接 dashboard"，
        # 既避免启动反复连接 localhost:8858，也不影响 Nacos 规则数据源。
        # 需要可视化/动态改规则时再填 localhost:8858。
        dashboard:
        port: 8719
      eager: true
    loadbalancer:
      enabled: true

logging:
  level:
    org.springframework: info
    com.gem: debug

server:
  # T2.4 韧性：优雅停机开关（Boot 3 默认 immediate，需显式设为 graceful）
  shutdown: graceful

# T2.4 韧性：Feign 超时统一基线
# 各服务共同加载本文件，故在此集中定义默认值，避免每个模块各写一份导致漂移。
# 说明：
# - 项目内不存在 RestTemplate/WebClient 调用（已 grep 确认），Feign 是唯一出站 HTTP 通道。
# - 具体服务可在自己的 xxx-dev.yml 里覆盖（如 baize-auth-dev.yml 当前为 10000ms）。
# - 未开启 retryer：写操作自动重试会放大重复提交风险，重试交由业务与 Sentinel 熔断处理。
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000

# 可观测性（T2.1/T2.2，见 docs/adr/0003-observability-otel-lgtm.md）
# 本文件由各服务共同加载，故端点与追踪配置集中在此，避免五个模块重复维护。
management:
  endpoints:
    web:
      exposure:
        # 仅暴露必要端点；prometheus 供 ServiceMonitor/VM 抓取，metrics 供排障
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        # T2.4 韧性：暴露 liveness/readiness 供 K8s 探针使用
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        # 开启直方图后 Prometheus 可算 P95/P99（histogram_quantile）
        http.server.requests: true
  tracing:
    sampling:
      # dev 全采样便于排查；生产按需下调（如 0.1）或改为 ParentBased 采样
      probability: ${BAIZE_TRACING_SAMPLING:1.0}
    propagation:
      type: w3c
  otlp:
    tracing:
      # OTel Collector 的 OTLP/HTTP 入口；未部署 Collector 时导出失败不影响业务（异步批量上报）
      endpoint: ${BAIZE_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
      timeout: 10s

# 安全配置
baize:
  # 内部调用令牌：@InnerAuth 端点据此校验 Feign 客户端附加的 From-Inner 请求头。
  # 客户端（InnerAuthFeignConfig，baize-api-system）与服务端（InnerAuthInterceptor，
  # baize-common-webmvc）读同一个键，两端对称；为空时 @InnerAuth 端点全部拒绝（fail-closed，P1-E）。
  # 审计结论见 doc/inner-token-audit.md：全仓库 RestTemplate/WebClient 为 0，
  # 不存在绕过 Feign 的内部调用，可安全启用。
  # 注意：令牌为共享密钥，轮换时需一次性改这里并同步重启 system/auth/gateway。
  inner:
    token: baize-inner-a1f4c9d2-7e3b-4f18-9c05-8d6e2b7a41f3
  gateway:
    # 验证码
    captcha:
      enabled: true
      type: math
    # 防止XSS攻击
    xss:
      enabled: true
      excludeUrls:
        - /system/notice
  datasource:
    druid:
      username: postgres
      password: Cpn@2026
    master:
      # k3s NodePort：192.168.5.4:30432
      addr: 192.168.5.4:30432
      schema: baize
      username: postgres
      password: Cpn@2026
  redis:
    # k3s NodePort：192.168.5.4:30379
    host: 192.168.5.4
    port: 30379
    password: Cnos@2026