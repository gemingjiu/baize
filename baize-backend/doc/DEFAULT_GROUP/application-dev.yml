spring:
  data:
    redis:
      host: ${baize.redis.host}
      port: ${baize.redis.port}
      password: ${baize.redis.password}
  cloud:
    sentinel:
      # 开发集群未部署 Sentinel 控制台，直接关闭，避免启动反复连接 localhost:8858
      enabled: false
      transport:
        dashboard: localhost:8858
        port: 8719
      eager: true
    loadbalancer:
      enabled: true

logging:
  level:
    org.springframework: info
    com.gem: debug

# 可观测性（T2.1/T2.2，见 docs/adr/0003-observability-otel-lgtm.md）
# 本文件由各服务共同加载，故端点与追踪配置集中在此，避免五个模块重复维护。
management:
  endpoints:
    web:
      exposure:
        # 仅暴露必要端点；prometheus 供 ServiceMonitor/VM 抓取，metrics 供排障
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        # T2.4 韧性：暴露 liveness/readiness 供 K8s 探针使用
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        # 开启直方图后 Prometheus 可算 P95/P99（histogram_quantile）
        http.server.requests: true
  tracing:
    sampling:
      # dev 全采样便于排查；生产按需下调（如 0.1）或改为 ParentBased 采样
      probability: ${BAIZE_TRACING_SAMPLING:1.0}
    propagation:
      type: w3c
  otlp:
    tracing:
      # OTel Collector 的 OTLP/HTTP 入口；未部署 Collector 时导出失败不影响业务（异步批量上报）
      endpoint: ${BAIZE_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
      timeout: 10s

# 安全配置
baize:
  # 内部调用令牌：@InnerAuth 端点据此校验 Feign 客户端附加的 From-Inner 请求头。
  # 客户端（InnerAuthFeignConfig，baize-api-system）与服务端（InnerAuthInterceptor，
  # baize-common-webmvc）读同一个键，两端对称；为空时 @InnerAuth 端点全部拒绝（fail-closed，P1-E）。
  # 审计结论见 doc/inner-token-audit.md：全仓库 RestTemplate/WebClient 为 0，
  # 不存在绕过 Feign 的内部调用，可安全启用。
  # 注意：令牌为共享密钥，轮换时需一次性改这里并同步重启 system/auth/gateway。
  inner:
    token: baize-inner-a1f4c9d2-7e3b-4f18-9c05-8d6e2b7a41f3
  gateway:
    # 验证码
    captcha:
      enabled: true
      type: math
    # 防止XSS攻击
    xss:
      enabled: true
      excludeUrls:
        - /system/notice
  datasource:
    druid:
      username: postgres
      password: Cpn@2026
    master:
      # k3s NodePort：192.168.5.4:30432
      addr: 192.168.5.4:30432
      schema: baize
      username: postgres
      password: Cpn@2026
  redis:
    # k3s NodePort：192.168.5.4:30379
    host: 192.168.5.4
    port: 30379
    password: Cnos@2026