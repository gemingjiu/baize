# spring配置
spring:
  datasource:
    #设置默认的数据源或者数据源组,默认值即为master
    primary: master
    #严格匹配数据源,默认false. true未匹配到指定数据源时抛异常,false使用默认数据源
    strict: true
    druid:
      stat-view-servlet:
        # 代码生成只读取元数据，不需要 Druid 监控页（原配置用的是弱口令 admin 账号，已整体关闭）
        enabled: false
    dynamic:
      druid:
        initial-size: 5
        min-idle: 5
        maxActive: 20
        maxWait: 60000
        timeBetweenEvictionRunsMillis: 60000
        minEvictableIdleTimeMillis: 300000
        validationQuery: SELECT 1
        testWhileIdle: true
        testOnBorrow: false
        testOnReturn: false
        poolPreparedStatements: true
        maxPoolPreparedStatementPerConnectionSize: 20
        filters: stat,slf4j
        connectionProperties: druid.stat.mergeSql\\=true;druid.stat.slowSqlMillis\\=5000
      datasource:
        master:
          driver-class-name: org.postgresql.Driver
          # currentSchema 必须是库里真实存在的 schema：集群里只有 baize-system（20 张表），
          # 原值 baize-gen 并不存在，DatabaseMetaData.getTables 会静默返回空列表。
          url: jdbc:postgresql://${baize.datasource.master.addr}/${baize.datasource.master.schema}?currentSchema=baize-system&stringtype=unspecified
          username: ${baize.datasource.master.username}
          password: ${baize.datasource.master.password}

# ============================================================================
# 服务自身 context-path：与 baize-system / baize-auth 保持一致
# 网关路由 Path=/api/v1/gen/** -> lb://baize-gen 且不再 StripPrefix，
# 因此本服务必须自己吃掉 /api/v1 前缀，否则 Controller 的 /gen/** 映射匹配不到
# （现象：网关 404，直连 9300 报 No static resource api/v1/gen/table/page）。
# 访问形如 http://localhost:9300/api/v1/gen/tables
# ============================================================================
server:
  servlet:
    context-path: /api/v1
