# JWT 配置
jwt:
  secret: baize-a732659e-45e2-47a8-89ab-6c4b8af98bab
  expiration: 7200000

# T1.3 / ADR-0002：refresh token HttpOnly Cookie 模式
# 默认 enabled=false —— 保持旧链路（JSON 返回 refresh + 前端 localStorage + Bearer）零变更。
# 灰度切换时置 true：refresh 明文只走 HttpOnly Cookie，服务端存哈希 + family 轮转 + CSRF 双重提交。
# 注意：切换前需前端配合 credentials:'include' 并携带 X-XSRF-TOKEN 头，且网关 CORS 放行该头。
baize:
  security:
    token-cookie:
      enabled: false
      refresh-cookie-name: baize_refresh
      csrf-cookie-name: XSRF-TOKEN
      csrf-header-name: X-XSRF-TOKEN
      # Cookie Path 必须与 auth 服务对外路径（网关路由前缀）一致
      path: /api/v1/auth
      # dev 为 http，必须 false；生产 https 置 true
      secure: false
      same-site: Lax
      ttl-seconds: 604800 # 7 天

logging:
  level:
    com.gem: debug

# seata 配置
seata:
  enabled: false
# feign 配置
feign:
  sentinel:
    enabled: true
  okhttp:
    enabled: true
  httpclient:
    enabled: false
  client:
    config:
      default:
        connectTimeout: 10000
        readTimeout: 10000
  compression:
    request:
      enabled: true
    response:
      enabled: true

# T2.4 韧性：Sentinel 流控规则托管 Nacos（登录/刷新是最易被刷的入口）
# 规则文件入库：doc/DEFAULT_GROUP/sentinel/baize-auth-flow.json
# 未在 Nacos 建同名 dataId 时规则为空、不生效，但不影响启动。
spring:
  cloud:
    sentinel:
      datasource:
        flow:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
            namespace: ${NACOS_NAMESPACE:baize}
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:}
            group-id: DEFAULT_GROUP
            data-id: baize-auth-flow.json
            data-type: json
            rule-type: flow

# 暴露监控端点
# 注意：此处原先为 include: '*'，会把全部 actuator 端点（含 env/heapdump/threaddump）
# 暴露在网关可达路径下。T2.2 收敛为白名单，与 application-dev.yml 保持一致。
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  info:
    env:
      enabled: true