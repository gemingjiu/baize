# Tomcat
server:
  port: 8010
# Spring
spring:
  application:
    # 应用名称
    name: baize-auth
  profiles:
    # 环境配置
    active: dev
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        # 环境分组
        group: DEFAULT_GROUP
        # 产品命名空间
        # 命名空间必须填 Nacos 上的命名空间 ID（不是显示名）；环境里为 baize
        namespace: ${NACOS_NAMESPACE:baize}
        # 用户名（环境变量 NACOS_USERNAME，默认 nacos）
        username: ${NACOS_USERNAME:nacos}
        # 密码（环境变量 NACOS_PASSWORD，仓库中禁止提交真实口令）
        password: ${NACOS_PASSWORD:}
        # 是否启用
        enabled: true
      config:
        # 配置中心地址
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        # 环境分组
        group: DEFAULT_GROUP
        # 产品命名空间
        # 命名空间必须填 Nacos 上的命名空间 ID（不是显示名）；环境里为 baize
        namespace: ${NACOS_NAMESPACE:baize}
        # 用户名（环境变量 NACOS_USERNAME，默认 nacos）
        username: ${NACOS_USERNAME:nacos}
        # 密码（环境变量 NACOS_PASSWORD，仓库中禁止提交真实口令）
        password: ${NACOS_PASSWORD:}
        # 是否启用
        enabled: true
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
  config:
    import:
      - optional:nacos:application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
debug: off

seata:
  enabled: false