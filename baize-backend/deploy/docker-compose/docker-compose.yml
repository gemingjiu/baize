# ============================================================================
# 白泽中间件部署（PostgreSQL / Nacos / Redis / Sentinel Dashboard）
# 说明：
#   1. 本文件只包含中间件，应用服务（gateway/auth/system）的部署见 baize-backend 下各模块的
#      Dockerfile 与 k8s/helm 目录。
#   2. 所有口令一律通过环境变量或同目录 .env 文件注入，仓库中禁止提交明文口令，例如：
#        POSTGRES_USER=postgres
#        POSTGRES_PASSWORD=<强口令>
#        POSTGRES_DB=baize
#      启动：docker compose up -d
#   3. 镜像统一使用固定版本标签，禁止 latest，保证可重复构建。
#      版本与 deploy/k8s 清单保持一致：postgres:16-alpine、redis:7-alpine。
# ============================================================================
version: "3.8"
services:
  baize-postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      # 必须显式提供，未设置时 compose 直接报错退出，避免使用默认弱口令
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?请通过环境变量或 .env 提供 POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-baize}"
    ports:
      - "5432:5432"
    volumes:
      - /home/app/postgres/data:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    # 健康检查：其他中间件/应用可通过 depends_on.condition=service_healthy 等待数据库就绪
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-baize} -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always

  baize-nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: nacos
    volumes:
      - /home/app/nacos/logs:/home/nacos/logs
      - /home/app/nacos/data:/home/nacos/data
      - /home/app/nacos/plugins/:/home/nacos/plugins
      - /home/app/nacos/conf/application.properties:/home/nacos/conf/application.properties:rw
    ports:
      - '8848:8848'
      - '9848:9848'
    environment:
      - MODE=standalone
      - PREFER_HOST_MODE=hostname
      - NACOS_SERVER_PORT=8848
    restart: always

  baize-redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis/conf/redis.conf:/redis/conf/redis.conf
      - ./redis/data:/data
    restart: always

  baize-sentinel:
    # 固定版本：Sentinel Dashboard 1.8.8（bladex/sentinel-dashboard 镜像）
    image: bladex/sentinel-dashboard:1.8.8
    container_name: sentinel-dashboard
    environment:
      - JAVA_OPTS=-Dnacos.addr=nacos:8848  # 连接Nacos
    ports:
      - "8858:8858"
    restart: always
