# ============================================================================
# 白泽开发环境 Redis 配置（挂载到容器 /redis/conf/redis.conf）
#
# compose 里以 command 显式指定加载本文件；只保留开发环境需要的最小覆盖项，
# 其余全部沿用 redis:7-alpine 内置默认值。
# ============================================================================

# 绑定所有网卡（开发环境经 Docker 端口映射对外暴露 6379）
bind 0.0.0.0

# 关闭保护模式：容器内无 systemd/本地用户语义，访问控制依赖端口映射与网络隔离
protected-mode no

# 开发环境关闭密码（生产必须在 .env 注入 requirepass 并开启 AOF/RDB 持久化）
# requirepass <在 .env 中注入>

# 数据持久化：开启 AOF，数据落 ./redis/data 卷
appendonly yes
appendfsync everysec

# RDB 快照（开发环境宽松策略）
save 900 1
save 300 10

# 日志级别
loglevel notice

# 最大内存不限制（开发机自管），到达时优先淘汰带过期时间的键
maxmemory-policy volatile-lru
