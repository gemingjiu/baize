enabled: true
image:
  repository: nacos/nacos-server
  tag: v2.2.3
mode: standalone
preferHostMode: hostname
serverPort: 8848
datasource:
  host: 192.168.5.4
  port: 5432
  database: nacos_config
  username: postgres
  password: "CHANGE_ME_POSTGRES_PASSWORD"  # 部署时用 --set 或自定义 values 覆盖，禁止提交真实口令
service:
  ports:
    - name: http
      port: 8848
      targetPort: 8848
      nodePort: 30848
    - name: client-rpc
      port: 9848
      targetPort: 9848
      nodePort: 30849
persistence:
  enabled: false
  storageClass: ""
  logs:
    size: 1Gi
  data:
    size: 2Gi
  plugins:
    size: 1Gi