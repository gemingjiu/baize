{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nacos.fullname" . }}
  labels:
    {{- include "nacos.labels" . | nindent 4 }}
    app.kubernetes.io/component: nacos
spec:
  type: NodePort
  ports:
    {{- range .Values.service.ports }}
    - port: {{ .port }}
      targetPort: {{ .targetPort }}
      nodePort: {{ .nodePort }}
      protocol: TCP
      name: {{ .name }}
    {{- end }}
  selector:
    {{- include "nacos.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: nacos
{{- end }}