{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "redis.fullname" . }}
  labels:
    {{- include "redis.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: NodePort
  ports:
    - port: {{ .Values.service.port }}
      targetPort: redis
      nodePort: {{ .Values.service.nodePort }}
      protocol: TCP
      name: redis
  selector:
    {{- include "redis.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
{{- end }}