global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

# PostgreSQL Configuration
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: latest
  auth:
    username: postgres
    password: "baize@2023"
  service:
    port: 5432
    nodePort: 30432
  persistence:
    enabled: false
    storageClass: ""
    size: 8Gi

# Nacos Configuration
nacos:
  enabled: true
  image:
    repository: nacos/nacos-server
    tag: v2.2.3
  mode: standalone
  preferHostMode: hostname
  serverPort: 8848
  datasource:
    host: 192.168.5.4
    port: 5432
    database: nacos_config
    username: postgres
    password: "baize@2023"
  service:
    ports:
      - name: http
        port: 8848
        targetPort: 8848
        nodePort: 30848
      - name: client-rpc
        port: 9848
        targetPort: 9848
        nodePort: 30849
  persistence:
    enabled: false
    storageClass: ""
    logs:
      size: 1Gi
    data:
      size: 2Gi
    plugins:
      size: 1Gi

# Redis Configuration
redis:
  enabled: true
  image:
    repository: redis
    tag: latest
  service:
    port: 6379
    nodePort: 30379
  persistence:
    enabled: false
    storageClass: ""
    size: 2Gi