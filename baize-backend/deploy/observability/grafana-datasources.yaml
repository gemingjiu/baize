# Grafana 数据源自动装配（本地 LGTM 栈）
#
# 三个数据源互相打通，实现「指标 → 日志 → 追踪」的跳转闭环：
#   - Prometheus 为默认数据源（含 Tempo remote_write 写入的 RED 指标）
#   - Loki 关联 trace_id 字段（应用日志 pattern 中 %X{traceId} 已由 T2.1 打通）
#   - Tempo 反查 Loki 日志与 Prometheus 指标
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
      # 供 Tempo 面板从指标跳转到追踪
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      # 应用日志 JSON/文本中已含 traceId，配置派生字段即可点击跳转 Tempo
      derivedFields:
        - name: TraceID
          matcherRegex: '"traceId":"([0-9a-f]{32})"'
          url: "$${__value.raw}"
          datasourceUid: tempo

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      httpMethod: GET
      # 从 trace 跳到对应时间窗的 Loki 日志
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        filterByTraceID: true
        filterBySpanID: false
        tags:
          - key: service.name
            value: application
      # 从 trace 跳到 Prometheus 指标
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        tags:
          - key: service.name
            value: application
      # 服务图（Tempo metrics-generator 生成）
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      lokiSearch:
        datasourceUid: loki
