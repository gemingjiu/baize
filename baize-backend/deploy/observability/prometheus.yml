# Prometheus 配置（本地 LGTM 栈）
#
# 抓取目标：
#   - OTel Collector 自身指标（:8889）
#   - Tempo metrics-generator 远程写入（通过 --web.enable-remote-write-receiver 接收）
#   - 本地运行的 baize 应用（host.docker.internal 指向宿主机）
#
# 注意：应用必须已按 T2.1 暴露 /api/v1/actuator/prometheus，且本机应用端口为
# gateway 8000 / auth 8010 / system 8020。
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: baize-local
    environment: dev

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # 宿主机上的三个应用服务。若应用跑在容器网络内，改为对应服务名。
  # gateway/auth/system 的 context-path 均为 /api/v1，指标路径必须带前缀。
  - job_name: baize-gateway
    metrics_path: /api/v1/actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          application: baize-gateway

  - job_name: baize-auth
    metrics_path: /api/v1/actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8010"]
        labels:
          application: baize-auth

  - job_name: baize-system
    metrics_path: /api/v1/actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8020"]
        labels:
          application: baize-system
