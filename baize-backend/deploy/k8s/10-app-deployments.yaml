apiVersion: apps/v1
kind: Deployment
metadata:
  name: baize-system
  namespace: baize
  labels:
    app.kubernetes.io/name: baize-system
    app.kubernetes.io/part-of: baize
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: baize-system
  template:
    metadata:
      labels:
        app.kubernetes.io/name: baize-system
        app.kubernetes.io/part-of: baize
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8020"
        prometheus.io/path: "/api/v1/actuator/prometheus"
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: system
          image: baize/system:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8020
          env:
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -XX:MaxRAMPercentage=75
                -XX:+UseG1GC
            # Flyway 在 Nacos 配置缺失时可由环境变量兜底（T0.1 暴露过同类疏漏）
            - name: SPRING_FLYWAY_BASELINE_ON_MIGRATE
              value: "true"
          startupProbe:
            httpGet:
              path: /api/v1/actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 24
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/v1/actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/v1/actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 300m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 1536Mi
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: baize-system
