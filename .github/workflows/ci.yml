name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 后端：JDK 17 + Maven 缓存；先安装仓库内的 baize-parent，再构建全部后端模块
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (JDK 17)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # baize-backend 的 parent 是仓库内同级目录的 baize-parent，必须先安装到本地仓库
      - name: Install parent BOM
        run: mvn -B -Dfile.encoding=UTF-8 -f baize-parent/pom.xml install

      # 单元测试已可正常执行（父 POM 固定 maven-surefire-plugin 3.2.5），因此不再跳过
      # -Dfile.encoding=UTF-8：文档强调的编码项落到 CI（当前构建不加载配置故此前为良性，防未来回归）
      - name: Build and test backend
        run: mvn -B -Dfile.encoding=UTF-8 -f baize-backend/pom.xml package

  # ---------------------------------------------------------------------------
  # Helm chart 静态校验：helm lint + helm template 渲染
  # ---------------------------------------------------------------------------
  helm:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.3

      - name: Lint chart
        run: helm lint baize-backend/deploy/helm

      - name: Template render smoke
        run: helm template baize baize-backend/deploy/helm --set postgresql.auth.password=ci-dummy --set nacos.datasource.password=ci-dummy > /dev/null

  # ---------------------------------------------------------------------------
  # 前端：Node 20
  # 模板残留（example 页 / swagger / mock / oneapi.json）已清理，tsc 通过；
  # 但完整的 umi build 尚未在本机验证过，先保留 continue-on-error，验证后再改为阻塞。
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    # 2026-10-28 P1-K：本机 `npx max build`（11.8s）与 `npx tsc --noEmit` 均已验证通过，
    # 前端 CI 从「允许失败」改为与后端一致的阻塞门禁。
    continue-on-error: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: baize-ui/package-lock.json

      # lockfile 已提交（T1.2）：npm ci 保证可复现构建，配合 setup-node 的 npm 缓存加速。
      - name: Install dependencies
        working-directory: baize-ui
        run: npm ci

      # T1.5：Biome 统一 lint + format 门禁（阻塞）。biome ci 只检查不改写，
      # 任何 error 都会让本 job 变红；warning 不阻塞。src/.umi-undefined 等生成目录已在 biome.json 排除。
      - name: Biome CI (lint + format)
        working-directory: baize-ui
        run: npx biome ci .

      - name: Build
        working-directory: baize-ui
        run: npm run build

  # ---------------------------------------------------------------------------
  # SQL：PostgreSQL 16 service 容器，用 psql 做语法/执行校验
  #   - db/ddl/baize-system-ddl.sql：建表脚本（表名自带 "baize-system" schema 前缀）
  #   - db/init/baize-system-init.sql：初始化数据（使用未限定表名，需先 SET search_path）
  #   - db/init/baize-system-operlog.sql：操作日志建表脚本（PostgreSQL 方言，幂等）
  #   - db/migration/*.sql：增量迁移脚本（全部幂等，可重复执行）
  #
  # 幂等性约定：init 与 migration 脚本必须能在已有数据的库上重复执行
  # （INSERT 用 ON CONFLICT DO NOTHING，DDL 用 IF NOT EXISTS / DO 块判重），
  # 因此本 job 会对 init 连跑两次，第二次必须同样零报错。
  # ---------------------------------------------------------------------------
  sql:
    name: SQL (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: baize
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d baize"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create schema
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d baize -c 'CREATE SCHEMA IF NOT EXISTS "baize-system";'

      - name: Validate DDL
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d baize -f baize-backend/db/ddl/baize-system-ddl.sql

      - name: Validate operlog script
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d baize -f baize-backend/db/init/baize-system-operlog.sql

      # init 必须幂等：连跑两次，第二次零新增也零报错（ON CONFLICT DO NOTHING）
      - name: Validate init data (first run)
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d baize \
            -c 'SET search_path TO "baize-system";' \
            -f baize-backend/db/init/baize-system-init.sql

      - name: Validate init data (idempotent re-run)
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d baize \
            -c 'SET search_path TO "baize-system";' \
            -f baize-backend/db/init/baize-system-init.sql

      - name: Validate migrations
        run: |
          for f in baize-backend/db/migration/*.sql; do
            echo "== $f"
            psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d baize -f "$f"
          done

      # T1.1/DEC-3：Flyway 版本管理校验。
      # 上面已按手工路径跑完 ddl→init→migration，这里用 Flyway 对同一份权威脚本
      # 建立 baseline 并校验启动，证明 16 个脚本可被 Flyway 正确纳管。
      - name: Check duplicate Flyway versions
        run: |
          dupes=$(cd baize-backend/db/migration && for f in V*.sql; do echo "${f%%__*}"; done | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::Duplicate Flyway versions detected: $dupes"
            exit 1
          fi
          echo "All migration versions are unique."

      - name: Set up JDK 17 for Flyway validation
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 独立 POM（不继承 baize-parent）已把 postgresql 驱动作为插件依赖固定，
      # 无需 install parent BOM。baseline-version 与 spring.flyway.* 保持一致。
      - name: Validate Flyway migration history
        run: |
          mvn -B -f baize-backend/db/flyway-validate-pom.xml \
            -Dflyway.url=jdbc:postgresql://localhost:5432/baize \
            -Dflyway.user=postgres \
            -Dflyway.password=postgres \
            org.flywaydb:flyway-maven-plugin:9.22.3:migrate
          # 断言：history 表存在、有 baseline 记录、且无失败项（用完整 schema 限定，不依赖 search_path）
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d baize \
            -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema='baize-system' AND table_name='flyway_schema_history') THEN RAISE EXCEPTION 'flyway_schema_history missing'; END IF; IF NOT EXISTS (SELECT 1 FROM \"baize-system\".flyway_schema_history) THEN RAISE EXCEPTION 'flyway history empty'; END IF; IF EXISTS (SELECT 1 FROM \"baize-system\".flyway_schema_history WHERE success=false) THEN RAISE EXCEPTION 'failed migration in history'; END IF; END \$\$;"
